services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civic_registry}
      POSTGRES_USER: ${POSTGRES_USER:-civic_registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_registry}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic_registry} -d ${POSTGRES_DB:-civic_registry}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - civic_registry_postgres:/var/lib/postgresql/data

volumes:
  civic_registry_postgres:
