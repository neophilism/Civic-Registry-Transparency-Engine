name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, migrate, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: civic_registry
          POSTGRES_USER: civic_registry
          POSTGRES_PASSWORD: civic_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civic_registry -d civic_registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://civic_registry:civic_registry@localhost:5432/civic_registry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --allow-build=unrs-resolver

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Database integration tests
        run: pnpm test:db

      - name: Build
        run: pnpm build
