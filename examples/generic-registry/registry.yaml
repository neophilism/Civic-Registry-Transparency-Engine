schemaVersion: 1

registry:
  id: public-document-catalog
  name: Public Document Catalog
  description: Example configuration demonstrating a registry without custom code.
  defaultRecordTypeId: document
  publicByDefault: true

  recordTypes:
    - id: document
      name: Document
      pluralName: Documents
      titleFieldId: title
      summaryFieldId: summary

      fields:
        - id: title
          label: Title
          type: text
          required: true
          searchable: true
          sortable: true

        - id: summary
          label: Summary
          type: longText
          searchable: true

        - id: document_type
          label: Document type
          type: enum
          filterable: true
          options:
            - value: report
              label: Report
            - value: policy
              label: Policy
            - value: notice
              label: Notice

        - id: published_on
          label: Published on
          type: date
          filterable: true
          sortable: true

        - id: publisher
          label: Publisher
          type: entityRef
          targetRecordTypeIds:
            - organization

    - id: organization
      name: Organization
      pluralName: Organizations
      titleFieldId: name

      fields:
        - id: name
          label: Name
          type: text
          required: true
          searchable: true
          sortable: true

        - id: website
          label: Website
          type: url

  relationshipTypes:
    - id: published-by
      label: Published by
      inverseLabel: Published
      directed: true
      fromRecordTypeIds:
        - document
      toRecordTypeIds:
        - organization


publicationLifecycle:
  initialStatusId: draft

  statuses:
    - id: draft
      label: Draft

    - id: under_review
      label: Under review

    - id: approved
      label: Approved

    - id: published
      label: Published
      publiclyVisible: true
      marksPublished: true

    - id: withdrawn
      label: Withdrawn
      publiclyVisible: true

    - id: archived
      label: Archived
      publiclyVisible: true
      terminal: true

  transitions:
    - fromStatusId: draft
      toStatusId: under_review
      label: Submit for review
      allowedRoles:
        - editor

    - fromStatusId: under_review
      toStatusId: draft
      label: Return to draft
      allowedRoles:
        - reviewer

    - fromStatusId: under_review
      toStatusId: approved
      label: Approve
      allowedRoles:
        - reviewer
      approval:
        approverRoles:
          - reviewer
          - publisher
        minApprovals: 1
        requesterCannotApprove: true

    - fromStatusId: approved
      toStatusId: published
      label: Publish
      allowedRoles:
        - publisher

    - fromStatusId: published
      toStatusId: withdrawn
      label: Withdraw
      allowedRoles:
        - publisher

    - fromStatusId: withdrawn
      toStatusId: published
      label: Republish
      allowedRoles:
        - publisher

    - fromStatusId: published
      toStatusId: archived
      label: Archive
      allowedRoles:
        - publisher

    - fromStatusId: withdrawn
      toStatusId: archived
      label: Archive
      allowedRoles:
        - publisher

  scheduledPublication:
    enabled: true
    fromStatusIds:
      - approved
    targetStatusId: published
    allowedRoles:
      - publisher


deadlines:
  calendars:
    - id: federal_business
      label: Federal business days
      weekendDays:
        - 0
        - 6
      excludedDates:
        - "2026-01-01"
        - "2026-12-25"

  definitions:
    - id: review_due
      label: Review due
      description: Example public deadline calculated from the configured publication-date field.
      recordTypeIds:
        - document
      anchor:
        kind: field
        fieldId: published_on
      offset:
        value: 20
        unit: businessDays
      warningOffset:
        value: 5
        unit: businessDays
      calendarId: federal_business
      dateOnlyAnchorTime: end
      pauseWhileStatuses:
        - withdrawn
      completeWhenStatuses:
        - archived
      publiclyVisible: true

    - id: manual_response
      label: Manual response deadline
      description: Example internal deadline whose anchor is supplied when the obligation is created.
      recordTypeIds:
        - document
      anchor:
        kind: manual
      offset:
        value: 10
        unit: businessDays
      calendarId: federal_business
      publiclyVisible: false

disclosure:
  withheldRecordBehavior: placeholder
  defaultRedactionText: "[REDACTED]"
  defaultWithheldFieldText: "[WITHHELD]"
  withheldRecordTitle: "Record withheld"
  withheldRecordSummary: "Public contents are withheld."
  withheldDocumentTitle: "Document withheld"
  showReasons: true
  showAuthorities: true

presentation:
  recordTypes:
    document:
      listFields:
        - title
        - document_type
        - published_on
      detailFields:
        - title
        - summary
        - document_type
        - published_on
        - publisher
      defaultSort:
        fieldId: published_on
        direction: desc

    organization:
      listFields:
        - name

notifications:
  enabled: true
  eventTypes:
    - record.published
    - record.changed
    - record.matching_created
    - deadline.approaching
    - deadline.missed
    - document.added
  allowedChannels:
    - email
    - webhook
    - internal
  deadlineApproachingDays: 7
  maxDeliveryAttempts: 5
  retryBaseSeconds: 60
