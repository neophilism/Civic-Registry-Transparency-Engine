schemaVersion: 1

registry:
  id: public-document-catalog
  name: Public Document Catalog
  description: Example configuration demonstrating a registry without custom code.
  defaultRecordTypeId: document
  publicByDefault: true

  recordTypes:
    - id: document
      name: Document
      pluralName: Documents
      titleFieldId: title
      summaryFieldId: summary

      fields:
        - id: title
          label: Title
          type: text
          required: true
          searchable: true
          sortable: true

        - id: summary
          label: Summary
          type: longText
          searchable: true

        - id: document_type
          label: Document type
          type: enum
          filterable: true
          options:
            - value: report
              label: Report
            - value: policy
              label: Policy
            - value: notice
              label: Notice

        - id: published_on
          label: Published on
          type: date
          filterable: true
          sortable: true

        - id: publisher
          label: Publisher
          type: entityRef
          targetRecordTypeIds:
            - organization

    - id: organization
      name: Organization
      pluralName: Organizations
      titleFieldId: name

      fields:
        - id: name
          label: Name
          type: text
          required: true
          searchable: true
          sortable: true

        - id: website
          label: Website
          type: url

  relationshipTypes:
    - id: published-by
      label: Published by
      inverseLabel: Published
      directed: true
      fromRecordTypeIds:
        - document
      toRecordTypeIds:
        - organization


publicationLifecycle:
  initialStatusId: draft

  statuses:
    - id: draft
      label: Draft

    - id: under_review
      label: Under review

    - id: approved
      label: Approved

    - id: published
      label: Published
      publiclyVisible: true
      marksPublished: true

    - id: withdrawn
      label: Withdrawn
      publiclyVisible: true

    - id: archived
      label: Archived
      publiclyVisible: true
      terminal: true

  transitions:
    - fromStatusId: draft
      toStatusId: under_review
      label: Submit for review
      allowedRoles:
        - editor

    - fromStatusId: under_review
      toStatusId: draft
      label: Return to draft
      allowedRoles:
        - reviewer

    - fromStatusId: under_review
      toStatusId: approved
      label: Approve
      allowedRoles:
        - reviewer
      approval:
        approverRoles:
          - reviewer
          - publisher
        minApprovals: 1
        requesterCannotApprove: true

    - fromStatusId: approved
      toStatusId: published
      label: Publish
      allowedRoles:
        - publisher

    - fromStatusId: published
      toStatusId: withdrawn
      label: Withdraw
      allowedRoles:
        - publisher

    - fromStatusId: withdrawn
      toStatusId: published
      label: Republish
      allowedRoles:
        - publisher

    - fromStatusId: published
      toStatusId: archived
      label: Archive
      allowedRoles:
        - publisher

    - fromStatusId: withdrawn
      toStatusId: archived
      label: Archive
      allowedRoles:
        - publisher

  scheduledPublication:
    enabled: true
    fromStatusIds:
      - approved
    targetStatusId: published
    allowedRoles:
      - publisher

presentation:
  recordTypes:
    document:
      listFields:
        - title
        - document_type
        - published_on
      detailFields:
        - title
        - summary
        - document_type
        - published_on
        - publisher
      defaultSort:
        fieldId: published_on
        direction: desc

    organization:
      listFields:
        - name
